name: MarketPulse CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies
        run: npm --prefix server install

      - name: Install Client Dependencies
        run: npm --prefix client install

      - name: Run Backend API Test Suite
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/multi_vendor_marketplace
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_test_jwt_secret_key_2026
        run: |
          node server/src/server.js &
          npx --yes wait-on http://127.0.0.1:5000/api/health --timeout 30000
          npm --prefix server test

      - name: Build Frontend Client Bundle
        run: npm --prefix client run build
